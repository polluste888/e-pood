<!DOCTYPE html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>E‑Pood</title>
  </head>
  <body>
    <header>
      <h1 id="nav-logo"><img src="mark.jpg" alt="E-Pood Logo" /></h1>
      <nav>
        <ul>
          <li>
            <a id="nav-home" title="Kodu"><i class="fas fa-home"></i></a>
          </li>
          <li>
            <a id="nav-favorites" title="Lemmikud"
              ><i class="fas fa-heart"></i
            ></a>
          </li>
          <li>
            <a id="nav-cart" title="Ostukorv">
              <i class="fas fa-shopping-cart"></i>
              <span id="cart-count">🛒 0</span>
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <h2 id="page-title">Kõik tooted</h2>

      <div id="category-filters"></div>

      <div id="product-list"></div>
      <div id="product-details" style="display: none"></div>
      <div id="cart-view" style="display: none"></div>
      <div id="favorites-view" style="display: none"></div>
    </main>

    <footer>
      <p
        id="customer-info"
        style="text-align: center; margin-top: 20px; color: grey"
      ></p>
    </footer>

    <script type="module" src="main.js"></script>
  </body>
</html>
